<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="coastalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D6E6E" />
      <stop offset="100%" stop-color="#08383B" />
    </linearGradient>
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
  </defs>

  <!-- Rounded App Tile Background -->
  <rect width="64" height="64" rx="16" fill="url(#coastalGrad)" />

  <!-- Subtle Coastal Wave Accent -->
  <path d="M 0,44 Q 16,36 32,42 T 64,38 L 64,64 L 0,64 Z" fill="#06282B" opacity="0.4" />

  <!-- Main Paw Print (Crisp Pure White & Mint Accent) -->
  <g fill="#FFFFFF">
    <!-- Toe 1 -->
    <ellipse cx="18" cy="25" rx="5" ry="7" transform="rotate(-20 18 25)" />
    <!-- Toe 2 -->
    <ellipse cx="28" cy="17" rx="5.5" ry="8" transform="rotate(-6 28 17)" />
    <!-- Toe 3 -->
    <ellipse cx="40" cy="17" rx="5.5" ry="8" transform="rotate(6 40 17)" />
    <!-- Toe 4 -->
    <ellipse cx="50" cy="25" rx="5" ry="7" transform="rotate(20 50 25)" />

    <!-- Main Pad -->
    <path d="M 21,39 C 17,44 20,53 29,56 C 33,57.5 37,57.5 41,56 C 50,53 53,44 49,39 C 45,34 39,37 35,37 C 31,37 25,34 21,39 Z" />
  </g>

  <!-- Sparkle Star in Bright Teal -->
  <path d="M 52,10 Q 52,15 47,15 Q 52,15 52,20 Q 52,15 57,15 Q 52,15 52,10 Z" fill="url(#tealGlow)" />
</svg>
